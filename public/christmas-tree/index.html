<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merry Christmas, Eloise</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #02040b;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #scene { z-index: 1; }
    #fx { z-index: 2; pointer-events: none; }

    .title-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 4.5%;
      z-index: 3;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .title-text {
      font-family: "Snell Roundhand", "Apple Chancery", "Zapfino", cursive;
      font-weight: 500;
      font-size: clamp(34px, 5.2vw, 76px);
      line-height: 1.2;
      letter-spacing: 0.02em;
      padding: 0 24px;
      color: rgba(255, 255, 255, 0.96);
      text-shadow:
        0 0 10px rgba(210, 232, 255, 0.85),
        0 0 28px rgba(155, 205, 255, 0.45);
      clip-path: inset(0 100% 0 0);
      opacity: 0;
    }

    .hint {
      position: fixed;
      right: 16px;
      bottom: 12px;
      z-index: 4;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12px;
      color: rgba(210, 230, 255, 0.38);
      letter-spacing: 0.04em;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }

    .hint.fade { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <canvas id="fx"></canvas>
  <div class="title-wrap">
    <div class="title-text" id="title">Merry Christmas, Eloise</div>
  </div>
  <div class="hint" id="hint">드래그하여 회전 · 스페이스 일시정지/계속 · R 다시 보기 · F 전체 화면</div>

  <script src="./engine.js"></script>
  <script src="./particles.js"></script>
  <script>
    (() => {
      const { createRenderer, createBloom, createCamera } = window.ChristmasEngine;
      const {
        ParticleField,
        Fireworks,
        Snowfall,
        createPointExtras,
        createRibbons,
        createCometSystem,
      } = window.ChristmasParticles;

      const canvas = document.getElementById("scene");
      const fxCanvas = document.getElementById("fx");
      const fx = fxCanvas.getContext("2d");
      const titleEl = document.getElementById("title");
      const hintEl = document.getElementById("hint");
      setTimeout(() => hintEl.classList.add("fade"), 5000);

      const gl = canvas.getContext("webgl2", {
        antialias: false,
        powerPreference: "high-performance",
      });

      if (!gl) {
        document.body.innerHTML =
          '<p style="color:#fff;padding:24px;font-family:sans-serif">이 브라우저는 WebGL2를 지원하지 않습니다。</p>';
        return;
      }

      const renderer = createRenderer(gl, { hdr: true, bloomLevels: 7 });
      const camera = createCamera({ fov: 36, near: 0.05, far: 1200 });

      const TREE = { height: 10.6, radius: 4.2, tiers: 9, points: 220000 };
      const PALETTE = {
        needle: [0.62, 0.78, 1.00], // ice blue
        light:  [1.00, 0.74, 0.38], // champagne gold
        star:   [1.00, 0.97, 0.90], // warm white
        aurora: [0.10, 0.85, 0.62], // northern lights
      };

      const BAUBLES = [
        bauble("#d99b4e", "#6a3208", "#fff0d8"), // bright gold
        bauble("#c9d2df", "#5a6274", "#ffffff"), // silver
        bauble("#57b4e8", "#0b2a3d", "#e8f6ff"), // ice blue
        bauble("#2a7f9e", "#082834", "#a8e6ff"), // deep teal
        bauble("#e8d09a", "#785a1a", "#fff3e0"), // champagne
      ];

      function bauble(base, shade, glint) {
        return { base: hex(base), shade: hex(shade), glint: hex(glint) };
      }

      function hex(c) {
        const n = parseInt(c.slice(1), 16);
        return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
      }

      // Seeded RNG (mulberry32)
      function mulberry32(seed) {
        return () => {
          seed = seed + 0x6d2b79f5 | 0;
          let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      const rand = mulberry32(1225);

      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const smoothstep = (e0, e1, x) => {
        const t = clamp((x - e0) / (e1 - e0), 0, 1);
        return t * t * (3 - 2 * t);
      };
      const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

      // Branch = curved drooping spine + fluffy 3D pine needles
      function growBranch(tier, angle) {
        const y = 0.55 + (TREE.height - 0.85) * (tier + rand() * 0.75) / TREE.tiers;
        const reach = TREE.radius * (1 - y / TREE.height) * (0.86 + rand() * 0.28);
        const spine = [];
        for (let i = 0; i <= 12; i++) {
          const s = i / 12;
          const droop = -0.18 * s * s * reach;
          spine.push([
            Math.cos(angle) * reach * s,
            y + droop,
            Math.sin(angle) * reach * s,
          ]);
        }
        return { spine, reach, y, angle };
      }

      function pointOnSpine(spine, s) {
        const f = s * (spine.length - 1);
        const i = Math.min(spine.length - 2, Math.floor(f));
        const t = f - i;
        const a = spine[i], b = spine[i + 1];
        return [
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t,
        ];
      }

      function needlesFor(branch, out) {
        const count = Math.round(branch.reach * 420);
        const perpX = -Math.sin(branch.angle);
        const perpZ = Math.cos(branch.angle);
        for (let k = 0; k < count; k++) {
          const s = (k + 0.5) / count;
          const side = rand() < 0.5 ? -1 : 1;
          const p = pointOnSpine(branch.spine, s);
          const len = 0.18 + 0.52 * (1 - s);
          const q = Math.sqrt(rand());

          const hx = p[0] + side * q * len * perpX + (rand() - 0.5) * 0.25;
          const hy = Math.max(0.14, p[1] - 0.08 * q + (rand() - 0.5) * 0.25);
          const hz = p[2] + side * q * len * perpZ + (rand() - 0.5) * 0.25;

          const bAngle = rand() * Math.PI * 2;
          const bRadius = 0.6 + Math.pow(rand(), 0.72) * 11.5;
          const bSpiral = bAngle + bRadius * 0.48;
          const bx = Math.cos(bSpiral) * bRadius;
          const bz = Math.sin(bSpiral) * bRadius;
          const by = 0.15 + Math.exp(-bRadius * 0.28) * rand() * 3.8 + (rand() - 0.5) * 0.35;

          const bright = 0.62 + 0.38 * s;
          const isSilver = rand() < 0.28;
          const cr = (isSilver ? 0.88 : PALETTE.needle[0]) * bright;
          const cg = (isSilver ? 0.94 : PALETTE.needle[1]) * bright;
          const cb = (isSilver ? 1.00 : PALETTE.needle[2]) * bright;

          const size = rand() < 0.09 ? 3.4 + rand() * 1.8 : 1.7 + rand() * 1.6;
          out.push(
            hx, hy, hz,
            bx, by, bz,
            cr, cg, cb,
            size,
            rand() * Math.PI * 2,
            hy / TREE.height
          );
        }
      }

      function buildTree() {
        const points = [];
        for (let tier = 0; tier < TREE.tiers; tier++) {
          const branches = Math.round(18 - tier * 1.1);
          for (let b = 0; b < branches; b++) {
            const angle = (b / branches) * Math.PI * 2 + rand() * 0.38 + tier * 0.31;
            needlesFor(growBranch(tier, angle), points);
          }
        }
        for (let i = 0; i < 14000; i++) {
          const u = Math.pow(rand(), 0.85);
          const y = 0.30 + u * (TREE.height - 0.30);
          const r = TREE.radius * (1 - y / TREE.height) * (0.20 + 0.76 * Math.sqrt(rand()));
          const a = rand() * Math.PI * 2;
          const hx = Math.cos(a) * r;
          const hz = Math.sin(a) * r;

          const bRadius = 0.3 + rand() * 9.0;
          const bSpiral = rand() * Math.PI * 2 + bRadius * 0.5;
          const bx = Math.cos(bSpiral) * bRadius;
          const bz = Math.sin(bSpiral) * bRadius;
          const by = 0.2 + rand() * 5.2;

          const isTip = rand() < 0.22;
          points.push(
            hx, y, hz,
            bx, by, bz,
            isTip ? 0.92 : PALETTE.needle[0],
            isTip ? 0.96 : PALETTE.needle[1],
            1.00,
            isTip ? 3.2 : 1.9,
            rand() * Math.PI * 2,
            y / TREE.height
          );
        }
        return new ParticleField(gl, new Float32Array(points));
      }

      // Fairy lights + spherical baubles
      function buildLights() {
        const lights = [];
        for (let g = 0; g < 7; g++) {
          const y0 = 1.2 + g * 1.25;
          const turns = 1.15;
          for (let i = 0; i < 100; i++) {
            const u = i / 100;
            const a = u * turns * Math.PI * 2 + g * 0.9;
            const y = y0 + u * 0.9 - 0.16 * Math.pow(Math.sin(u * Math.PI), 2);
            if (y >= TREE.height - 0.15) continue;
            const r = TREE.radius * (1 - y / TREE.height) + 0.08;
            lights.push({
              pos: [Math.cos(a) * r, y, Math.sin(a) * r],
              twinkle: rand(),
            });
          }
        }
        const baubles = [];
        for (let i = 0; i < 48; i++) {
          const u = 0.08 + rand() * 0.80;
          const y = u * TREE.height;
          const r = TREE.radius * (1 - u) * (0.72 + rand() * 0.25);
          const a = rand() * Math.PI * 2;
          baubles.push({
            pos: [Math.cos(a) * r, y, Math.sin(a) * r],
            palette: BAUBLES[i % BAUBLES.length],
            size: 13 + rand() * 7,
          });
        }
        return { lights, baubles };
      }

      // Scene timeline (seconds)
      const SCENE = {
        spark:   0.0,
        comet:   0.6,
        burst:   2.2,
        gather:  3.35,
        lightUp: 5.85,
        star:    8.4,
        title:   8.85,
      };
      const LOOP_DURATION = 21.0;

      // Comet sweeps from bottom-left arc across front-right and spirals into base center
      function cometPath(u) {
        if (u < 0.55) {
          const k = u / 0.55;
          const x = -7.8 + k * 14.2;
          const y = 0.35 + Math.sin(k * Math.PI * 0.85) * 3.1;
          const z = 5.5 - k * 4.5;
          return [x, y, z];
        }
        const k = (u - 0.55) / 0.45;
        const a = k * Math.PI * 1.45;
        const r = 6.4 * (1 - k * 0.92);
        const y = 2.0 + Math.sin(k * Math.PI) * 1.6 - k * 1.1;
        return [Math.cos(a) * r, y, Math.sin(a) * r];
      }

      const tree = buildTree();
      const { lights, baubles } = buildLights();
      const extras = createPointExtras(gl, lights, baubles);
      const ribbons = createRibbons(gl, { turns: 4.5, from: 0.4, to: TREE.height, radius: TREE.radius });
      const snow = new Snowfall(gl, { count: 4800, area: 60, wind: [0.15, 0, 0.05] });
      const fireworks = new Fireworks(gl, { shells: 12, startAt: 9.0 });
      const comet = createCometSystem(gl, cometPath);
      const bloom = createBloom(gl, { threshold: 0.65, knee: 0.45, streak: 0.48 });

      // 2D Canvas overlay for luminous intro spark orb & 8-rayed starburst topper
      function drawFlareOrb(sx, sy, radius, alpha, streakWidth) {
        if (alpha <= 0.005) return;
        fx.save();
        fx.globalCompositeOperation = "lighter";

        const g = fx.createRadialGradient(sx, sy, 0, sx, sy, radius);
        g.addColorStop(0.0, `rgba(255, 253, 245, ${alpha})`);
        g.addColorStop(0.18, `rgba(235, 245, 255, ${alpha * 0.85})`);
        g.addColorStop(0.50, `rgba(140, 190, 255, ${alpha * 0.28})`);
        g.addColorStop(1.0, "rgba(60, 110, 220, 0)");
        fx.fillStyle = g;
        fx.beginPath();
        fx.arc(sx, sy, radius, 0, Math.PI * 2);
        fx.fill();

        // Horizontal anamorphic flare streak
        const sg = fx.createLinearGradient(sx - streakWidth, sy, sx + streakWidth, sy);
        sg.addColorStop(0.0, "rgba(150, 200, 255, 0)");
        sg.addColorStop(0.5, `rgba(235, 246, 255, ${alpha * 0.55})`);
        sg.addColorStop(1.0, "rgba(150, 200, 255, 0)");
        fx.fillStyle = sg;
        fx.fillRect(sx - streakWidth, sy - 2.2, streakWidth * 2, 4.4);
        fx.restore();
      }

      function drawStarburst(sx, sy, scale, alpha, t) {
        if (alpha <= 0.005) return;
        fx.save();
        fx.translate(sx, sy);
        fx.globalCompositeOperation = "lighter";

        const pulse = 0.94 + 0.06 * Math.sin(t * 2.8);
        const rGlow = 56 * scale * pulse;

        const halo = fx.createRadialGradient(0, 0, 0, 0, 0, rGlow);
        halo.addColorStop(0.0, `rgba(255, 252, 240, ${alpha})`);
        halo.addColorStop(0.20, `rgba(225, 238, 255, ${alpha * 0.68})`);
        halo.addColorStop(0.55, `rgba(140, 195, 255, ${alpha * 0.22})`);
        halo.addColorStop(1.0, "rgba(80, 140, 240, 0)");
        fx.fillStyle = halo;
        fx.beginPath();
        fx.arc(0, 0, rGlow, 0, Math.PI * 2);
        fx.fill();

        const drawRay = (angle, len, thick, strength) => {
          fx.save();
          fx.rotate(angle);
          const lg = fx.createLinearGradient(-len, 0, len, 0);
          lg.addColorStop(0.0, "rgba(210, 230, 255, 0)");
          lg.addColorStop(0.5, `rgba(255, 252, 244, ${alpha * strength})`);
          lg.addColorStop(1.0, "rgba(210, 230, 255, 0)");
          fx.fillStyle = lg;
          fx.beginPath();
          fx.moveTo(-len, 0);
          fx.quadraticCurveTo(0, -thick, len, 0);
          fx.quadraticCurveTo(0, thick, -len, 0);
          fx.fill();
          fx.restore();
        };

        // 8-rayed starburst + wide horizontal cinema streak
        drawRay(0, 115 * scale * pulse, 2.4 * scale, 0.85);
        drawRay(Math.PI / 2, 72 * scale * pulse, 2.2 * scale, 0.92);
        drawRay(Math.PI / 4, 62 * scale * pulse, 1.8 * scale, 0.78);
        drawRay(-Math.PI / 4, 62 * scale * pulse, 1.8 * scale, 0.78);

        fx.restore();
      }

      // Viewport & Retina handling
      let width = 0, height = 0, dpr = 1;
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        fxCanvas.width = canvas.width;
        fxCanvas.height = canvas.height;
        fx.setTransform(dpr, 0, 0, dpr, 0, 0);
        renderer.resize(canvas.width, canvas.height);
        camera.update(canvas.width, canvas.height);
      }
      window.addEventListener("resize", resize);
      resize();

      // Interactive controls
      let simTime = 0;
      let paused = false;
      let dragYaw = 0, dragPitch = 0, dragging = false, lx = 0, ly = 0;

      window.addEventListener("pointerdown", (e) => {
        dragging = true;
        lx = e.clientX;
        ly = e.clientY;
      });
      window.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        dragYaw += (e.clientX - lx) * 0.005;
        dragPitch = clamp(dragPitch + (e.clientY - ly) * 0.003, -0.18, 0.25);
        lx = e.clientX;
        ly = e.clientY;
      });
      window.addEventListener("pointerup", () => { dragging = false; });
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          paused = !paused;
        } else if (e.key === "r" || e.key === "R") {
          simTime = 0;
        } else if (e.key === "f" || e.key === "F") {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        }
      });

      let lastTs = performance.now();
      function frame(ts) {
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;
        if (!paused) {
          simTime = (simTime + dt) % LOOP_DURATION;
        }
        const t = simTime;

        // Subtle continuous camera breathing & user orbit
        const camDist = 22.4;
        const elev = 0.02 + dragPitch;
        const yaw = Math.sin(t * 0.14) * 0.04 + dragYaw;
        camera.eye = [
          Math.sin(yaw) * camDist * Math.cos(elev),
          4.85 + Math.sin(elev) * camDist,
          Math.cos(yaw) * camDist * Math.cos(elev),
        ];
        camera.target = [0, 5.25, 0];
        camera.update(canvas.width, canvas.height);

        const auroraFade = smoothstep(3.2, 6.4, t);
        const gatherK = easeInOut(clamp((t - SCENE.gather) / 2.4, 0, 1));
        const treeVis = smoothstep(SCENE.burst, SCENE.burst + 0.55, t);
        const lightUp = smoothstep(SCENE.lightUp, SCENE.lightUp + 1.5, t);
        const ribbonReveal = smoothstep(SCENE.lightUp + 0.2, SCENE.lightUp + 2.2, t);
        const starAlpha = smoothstep(SCENE.star, SCENE.star + 0.7, t);
        const snowVis = smoothstep(SCENE.gather + 0.6, SCENE.star + 0.4, t);
        const treeAngle = t * 0.26;

        // 1. WebGL2 HDR Scene Pass
        renderer.beginScene();
        renderer.drawSky(camera, t, auroraFade, treeVis * (0.4 + 0.6 * gatherK));

        if (t >= SCENE.comet && t <= SCENE.burst + 1.1) {
          const headU = clamp((t - SCENE.comet) / (SCENE.burst - SCENE.comet), 0, 1);
          const fade = 1.0 - smoothstep(SCENE.burst + 0.2, SCENE.burst + 1.0, t);
          comet.draw(camera, { headU, fade, pixelRatio: dpr });
        }

        // Mirrored lake reflection of the tree + main tree
        tree.draw(camera, { time: t, angle: treeAngle, gather: gatherK, visibility: treeVis, pixelRatio: dpr, reflect: true });
        tree.draw(camera, { time: t, angle: treeAngle, gather: gatherK, visibility: treeVis, pixelRatio: dpr, reflect: false });

        extras.draw(camera, { time: t, angle: treeAngle, lightUp, pixelRatio: dpr });
        ribbons.draw(camera, { angle: treeAngle, reveal: ribbonReveal, brightness: 1.15 });
        snow.draw(camera, { time: t, visibility: snowVis, pixelRatio: dpr });
        fireworks.draw(camera, { time: t });

        renderer.endSceneAndBloom(bloom);

        // 2. 2D Flare / Starburst Overlay
        fx.clearRect(0, 0, width, height);

        // Initial spark orb -> moving comet head
        if (t < SCENE.burst + 0.45) {
          let orbPos = [0, 1.35, 2.0];
          if (t >= SCENE.comet) {
            orbPos = cometPath(clamp((t - SCENE.comet) / (SCENE.burst - SCENE.comet), 0, 1));
          }
          const orbScreen = camera.project(orbPos, width, height);
          if (orbScreen) {
            const fadeOut = 1.0 - smoothstep(SCENE.burst - 0.1, SCENE.burst + 0.4, t);
            const fadeIn = smoothstep(0.0, 0.35, t);
            const scale = (height / 720) * (22.4 / orbScreen.depth);
            const r = (t < SCENE.comet ? 95 : 72) * scale;
            drawFlareOrb(orbScreen.x, orbScreen.y, r, fadeIn * fadeOut, 320 * scale);
          }
        }

        // 8-rayed starburst topper at tree peak
        if (starAlpha > 0.005) {
          const starScreen = camera.project([0, TREE.height + 0.18, 0], width, height);
          if (starScreen) {
            const scale = (height / 720) * (22.4 / starScreen.depth);
            drawStarburst(starScreen.x, starScreen.y, scale, starAlpha, t);
          }
        }

        // 3. Cursive "Merry Christmas" handwriting reveal (8.85s .. 15.8s)
        const titleProg = smoothstep(SCENE.title, SCENE.title + 6.8, t);
        if (titleProg <= 0.001) {
          titleEl.style.opacity = "0";
        } else {
          titleEl.style.opacity = String(Math.min(1, titleProg * 3.0));
          titleEl.style.clipPath = `inset(0 ${(1 - titleProg) * 100}% 0 0)`;
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
